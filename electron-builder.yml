appId: com.clientbase.app
productName: База клиентов
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

files:
  - "**/*"
  - "!dist/**"
  - "!node_modules/.cache/**"

asarUnpack:
  - "node_modules/better-sqlite3/**"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "${productName} Setup ${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: База клиентов
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: nokerra
  repo: myproject
  releaseType: release